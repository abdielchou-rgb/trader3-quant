[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trader3"
version = "0.1.0"
description = "3号交易员 — 量化交易引擎（双模式：独立运行/嵌入2号分析师）"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
qlib = [
    "qlib>=1.0",
]
api = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "httpx>=0.24",
]
cvxpy = [
    "cvxpy>=1.4",
]
portfolio = [
    "riskfolio-lib>=6",
]
minute = [
    # parquet 存储后端；缺失时 trader3/v2/minute_data.py 自动退 CSV.gz，不阻断采集。
    # 备源 baostock 不强制安装：按需手动 pip install baostock（fetch_minute_bs 路径）。
    "pyarrow>=14",
]

[project.scripts]
trader3 = "trader3.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["trader3*"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["temp", "data", "evolve", "scripts", "examples", "shared_state", "trader3.egg-info", "tools/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 依赖注入要求 Body()/Header() 出现在参数默认值中，属框架惯用法而非坏味道
"trader3/api/server.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
follow_imports = "silent"
exclude = ["tests", "evolve", "scripts"]
files = [
    "trader3/data_provider.py",
    "trader3/models.py",
    "trader3/shared_state.py",
    "trader3/base_tool.py",
    "trader3/tools/execution.py",
    "trader3/notify.py",
    "trader3/v2/shadow_reconcile.py",
    "trader3/v2/live/qmt_broker.py",
    "trader3/data/pit_loader.py",
    "trader3/v2/live/order_state.py",
    "trader3/v2/live/robust_qmt_executor.py",
    "trader3/tools/execution_flow.py",
    "trader3/runtime/events.py",
    "trader3/runtime/strategy.py",
    "trader3/runtime/replay.py",
    "trader3/runtime/live_rt.py",
    "trader3/risk/gateway.py",
    "trader3/risk/drift_halt.py",
    "trader3/obs/telemetry.py",
    "trader3/research/experiment.py",
    "trader3/research/labeling.py",
    "trader3/research/rigor.py",
    "trader3/research/sample_weights.py",
    "trader3/research/factor_library.py",
    "trader3/research/collaborative.py",
    "trader3/research/ml_pipeline.py",
    "trader3/research/meta_ml.py",
]