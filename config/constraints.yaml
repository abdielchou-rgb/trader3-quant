portfolio:
  max_positions: 80
  min_positions: 20
  cash_buffer: 0.02

position:
  max_single: 0.06
  min_single: 0.005
  max_sector: 0.25
  max_factor_exposure:
    size: [-0.3, 0.3]
    value: [-0.5, 0.5]
    momentum: [-0.4, 0.4]

trading:
  max_daily_turnover: 0.15
  max_order_size_pct_adv: 0.10
  min_order_value: 50000
  commission_rate: 0.00025
  stamp_tax_rate: 0.001
  transfer_fee_rate: 0.00001

execution:
  default_algo: "adaptive_vwap"
  urgency_map:
    rebalance: "normal"
    stop_loss: "high"
    new_signal: "normal"
    risk_off: "high"